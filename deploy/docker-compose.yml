# Servidor (EC2): fica em /var/www/barbearia-vaz/ junto com o .env.production.
#   docker compose pull && docker compose up -d      (NUNCA --build: a imagem vem do GitHub Actions)
# O nginx do host faz proxy para 127.0.0.1:3003 — só loopback, a porta não fica exposta na internet.
services:
  app:
    image: ghcr.io/vinnisntos/barbearia-vaz:latest
    ports:
      - "127.0.0.1:3003:3000"
    env_file:
      - .env.production
    restart: unless-stopped
    # A instância tem ~900 MB para todos os projetos: o limite impede este app de derrubar os outros.
    mem_limit: 320m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
